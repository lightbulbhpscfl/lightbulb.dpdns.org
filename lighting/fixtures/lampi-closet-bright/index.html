<body>

  <div class="topbar">
    <div class="topbar-inner" id="breadcrumb"></div>

  <div class="container">
    <h1>Lampi Closet Bright</h1>

    <div class="section-title">Info</div>

      <tr><td>Wattage</td><td>13 Watts</td></tr>
      <tr><td>Voltage</td><td>120V</td></tr>

      <tr><td>Actual Draw</td><td>_</td></tr>
      <tr><td>Power Factor</td><td>_</td></tr>
    </table>

    <div class="section-title">Pictures</div>
     <div class="pictures-grid">
    <img src="image.webp" alt="Image"         onerror="          if (!this.dataset.fallback) {            this.dataset.fallback = 'true';            this.src = 'image.jpg';          } else if (this.parentElement) {            this.remove();          }        ">
    </div> <div class="pictures-grid">
    <img src="image1.webp" alt="Image"         onerror="          if (!this.dataset.fallback) {            this.dataset.fallback = 'true';            this.src = 'image.jpg';          } else if (this.parentElement) {            this.remove();          }        ">
    </div> <div class="pictures-grid">
    <img src="image2.webp" alt="Image"         onerror="          if (!this.dataset.fallback) {            this.dataset.fallback = 'true';            this.src = 'image.jpg';          } else if (this.parentElement) {            this.remove();          }        ">
    </div> <div class="pictures-grid">
    <img src="image3.webp" alt="Image"         onerror="          if (!this.dataset.fallback) {            this.dataset.fallback = 'true';            this.src = 'image.jpg';          } else if (this.parentElement) {            this.remove();          }        ">
    </div> <div class="pictures-grid">
    <img src="image4.webp" alt="Image"         onerror="          if (!this.dataset.fallback) {            this.dataset.fallback = 'true';            this.src = 'image.jpg';          } else if (this.parentElement) {            this.remove();          }        ">
    </div> <div class="pictures-grid">
    <img src="image5.webp" alt="Image"         onerror="          if (!this.dataset.fallback) {            this.dataset.fallback = 'true';            this.src = 'image.jpg';          } else if (this.parentElement) {            this.remove();          }        ">

    </div>
    
    

    <div class="section-title">Video</div>
    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/24KiVu9vJ94?si=ksFOgGXKDIdVyebf"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <footer>made by Carter Anderson</footer>
  </div>

  <script>
    (async () => {
      const link = document.getElementById('bulb-link');
      try {
        const res = await fetch('../lightbulb');
        if (!res.ok) throw new Error('Failed to fetch');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const title = doc.querySelector('title')?.textContent?.trim();
        if (title) { link.textContent = title; } else { throw new Error('No title found'); }
      } catch (e) { link.textContent = '../lightbulb'; }
    })();
  </script>
  <script defer src="/js/breadcrumb.js"></script>
</body>
</html>
