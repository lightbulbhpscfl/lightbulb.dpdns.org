<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Personal Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner" id="breadcrumb"></div>
  </div>

  <div class="container" style="max-width: 700px;">
    <h1><span class="logo"></span>·dpdns·org</h1>

    <p>
      H! This is my website, I made it, and I put it on the internet. It's literally running from a computer at my house. It just has whatever random stuff I decide to add :)
    </p>
    <a class="btn" href="clock.html" style="margin: 10px;">Retro clock</a>
    <a class="btn" href="dice.html" style="margin: 10px;">Roll a dice</a>
    <a class="btn" href="encode.html" style="margin: 10px;">Secret Encoder</a>
    <a class="btn" href="lighting.html" style="margin: 10px;">Lighting Stuff</a>

    <footer>
      made by Carter Anderson
    </footer>
  </div>

  <script>
    (function () {
      var bc = document.getElementById("breadcrumb");
      var homeLink = document.createElement("a");
      homeLink.href = "/";
      var logo = document.createElement("img");
      logo.src = "/logo-mid-res.png";
      logo.alt = "lightbulb.dpdns.org";
      logo.className = "topbar-logo";
      logo.onerror = function () {
        homeLink.textContent = "lightbulb.dpdns.org";
        if (logo.parentNode) homeLink.removeChild(logo);
      };
      homeLink.appendChild(logo);
      bc.appendChild(homeLink);
      var segments = window.location.pathname.split("/").filter(Boolean);
      var builtPath = "";
      segments.forEach(function (seg, i) {
        builtPath += "/" + seg;
        var sep = document.createElement("span");
        sep.className = "topbar-sep";
        sep.textContent = "→";
        bc.appendChild(sep);
        var name = decodeURIComponent(seg).replace(/[-_]/g, " ").replace(/\.\w+$/, "");
        name = name.charAt(0).toUpperCase() + name.slice(1);
        if (i === segments.length - 1) {
          var span = document.createElement("span");
          span.textContent = name;
          bc.appendChild(span);
        } else {
          var link = document.createElement("a");
          link.href = builtPath;
          link.textContent = name;
          bc.appendChild(link);
        }
      });
    })();
  </script>

</body>
</html>
