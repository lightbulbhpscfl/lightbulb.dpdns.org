<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dice Roller 🎲</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner" id="breadcrumb"></div>
  </div>

  <div class="container" style="max-width: 500px;">
    <h1>Dice Roller 🎲</h1>

    <div class="dice">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
      <div class="dot" id="dot4"></div>
      <div class="dot" id="dot5"></div>
      <div class="dot" id="dot6"></div>
      <div class="dot" id="dot7"></div>
      <div class="dot" id="dot8"></div>
      <div class="dot" id="dot9"></div>
    </div>

    <a class="btn" href="#" id="rollBtn">Roll Dice</a>

    <footer>
      made by Carter Anderson
    </footer>
  </div>

  <script>
    (function () {
      var bc = document.getElementById("breadcrumb");
      var homeLink = document.createElement("a");
      homeLink.href = "/";
      var logo = document.createElement("img");
      logo.src = "/logo-mid-res.png";
      logo.alt = "lightbulb.dpdns.org";
      logo.className = "topbar-logo";
      logo.onerror = function () {
        homeLink.textContent = "lightbulb.dpdns.org";
        if (logo.parentNode) homeLink.removeChild(logo);
      };
      homeLink.appendChild(logo);
      bc.appendChild(homeLink);
      var segments = window.location.pathname.split("/").filter(Boolean);
      var builtPath = "";
      segments.forEach(function (seg, i) {
        builtPath += "/" + seg;
        var sep = document.createElement("span");
        sep.className = "topbar-sep";
        sep.textContent = "→";
        bc.appendChild(sep);
        var name = decodeURIComponent(seg).replace(/[-_]/g, " ").replace(/\.\w+$/, "");
        name = name.charAt(0).toUpperCase() + name.slice(1);
        if (i === segments.length - 1) {
          var span = document.createElement("span");
          span.textContent = name;
          bc.appendChild(span);
        } else {
          var link = document.createElement("a");
          link.href = builtPath;
          link.textContent = name;
          bc.appendChild(link);
        }
      });
    })();

    const dice = document.querySelector('.dice');
    const dots = Array.from(document.querySelectorAll('.dot'));
    const rollBtn = document.getElementById('rollBtn');

    const patterns = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    function rollDice() {
      dots.forEach(dot => dot.classList.remove('visible'));
      const number = Math.floor(Math.random() * 6) + 1;
      const spins = 10 + Math.floor(Math.random() * 10);
      const possibleAngles = [0, 90, 180, 270];
      const finalAngle = possibleAngles[Math.floor(Math.random() * 4)];
      dice.style.transition = "transform 3s cubic-bezier(0.25, 1, 0.5, 1)";
      dice.style.transform = `rotate(${360 * spins + finalAngle}deg)`;
      setTimeout(() => {
        patterns[number].forEach(i => dots[i].classList.add('visible'));
      }, 3000);
    }

    window.onload = () => { setTimeout(rollDice, 200); };
    rollBtn.addEventListener('click', (e) => { e.preventDefault(); rollDice(); });
  </script>

</body>
</html>
